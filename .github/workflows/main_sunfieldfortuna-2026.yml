
name: Build and deploy Fortuna backend to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Upload backend
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: backend/
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download backend
        uses: actions/download-artifact@v4
        with:
          name: backend-app
          path: .

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_45CEE6ABB79F4664846811E4E0F1AB89 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5026D89FE8E8452982B024280589ED1C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_94F153F183064E2083B9A20399A09266 }}

      - name: Deploy backend to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: sunfieldfortuna-2026
          slot-name: Production
          package: .
